{% extends "base.html" %}
{% block content %}
<div class="row row-cols-1 row-cols-md-3 g-4">

    {% for team in teams %}
  <div class="col">
    <div class="card h-100">
      <div class="card-body">


        <a href="{% url 'team-detail' team.pk %}">
          <h5 class="card-title">{{ team.name }}</h5>
        </a>

      </div>
      
    </div>
  </div>
  {% empty %}
    <p>No teams found.</p>
  {% endfor %}

</div>
{% endblock content %}
